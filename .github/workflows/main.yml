name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Build APK with Gradle
      run: |
        # 自动解压仓库内的 ZIP 文件（如果有）
        if [ -f *.zip ]; then unzip -o *.zip; fi
        # 如果有子目录，将文件移动到根目录
        if [ -d HarmonicaBot ]; then cp -r HarmonicaBot/* .; fi
        # 自动生成 wrapper 并赋予权限编译
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: HarmonicaBot-APK
        path: "**/build/outputs/apk/debug/*.apk"
